<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار خرید هوشمند</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --header-bg: #111111;
            --bot-msg-bg: #1e1e1e;
            --user-msg-bg: #cba72a;
            --user-msg-text: #000000;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-color: #cba72a;
            --border-color: #2a2a2a;
            --error-bg: #3a1c1c;
            --error-text: #ff8a8a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: #333; /* پس زمینه برای دسکتاپ */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* کانتینر اصلی شبیه گوشی */
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        @media (min-width: 450px) {
            .app-container {
                height: 90vh;
                border-radius: 30px;
            }
        }

        /* هدر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .header-info {
            text-align: right;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .header-subtitle {
            font-size: 12px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-subtitle::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--accent-color);
            border-radius: 50%;
        }

        .ai-icon {
            width: 45px;
            height: 45px;
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: var(--accent-color);
        }

        /* ناحیه چت */
        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: none; /* فایرفاکس */
        }
        
        .chat-area::-webkit-scrollbar {
            display: none; /* کروم و سافاری */
        }

        /* جداکننده تاریخ */
        .date-divider {
            display: flex;
            align-items: center;
            color: var(--text-muted);
            font-size: 12px;
            margin: 10px 0;
        }

        .date-divider::before,
        .date-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--border-color);
        }

        .date-divider span {
            padding: 0 15px;
        }

        /* پیام ها */
        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.bot {
            justify-content: flex-start;
        }
        .msg {
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.6;
        }

        .msg.user {
            background-color: var(--user-msg-bg);
            color: var(--user-msg-text);
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .msg.bot {
            background-color: var(--bot-msg-bg);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .msg.error {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid #5c2626;
            width: 100%;
            text-align: center;
        }

        /* انیمیشن تایپ کردن */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 15px 20px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* کارت محصول */
        .product-card {
            background-color: var(--bot-msg-bg);
            border-radius: 18px;
            overflow: hidden;
            width: 100%;
            border: 1px solid var(--border-color);
        }

        .product-image-container {
            position: relative;
            width: 100%;
            height: 180px;
            background-color: #222;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: rgba(0, 0, 0, 0.7);
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .product-info {
            padding: 15px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .product-specs {
            font-size: 12px;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .product-price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .product-price-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }

        .product-price span {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: normal;
        }

        .btn-buy {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--user-msg-bg);
            color: var(--user-msg-text);
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* دکمه های پیشنهادی (Quick Replies) */
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .quick-reply-btn {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .quick-reply-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        /* ناحیه ورودی متن (فوتر) */
        .input-area {
            padding: 15px 20px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            padding-bottom: 25px; /* برای آیفون و نوار هوم */
        }

        .input-wrapper {
            display: flex;
            background-color: var(--bot-msg-bg);
            border-radius: 25px;
            padding: 5px;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 10px 15px;
            font-family: inherit;
            outline: none;
            font-size: 14px;
        }

        .input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .btn-send {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--user-msg-bg);
            color: var(--user-msg-text);
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- هدر -->
        <header class="header">
            <div class="header-info">
                <h1 class="header-title">دستیار خرید هوشمند</h1>
                <div class="header-subtitle">همراه شما برای انتخاب بهتر</div>
            </div>
            <div class="ai-icon">✨</div>
        </header>

        <!-- ناحیه چت -->
        <main class="chat-area" aria-live="polite"></main>


        <!-- ناحیه ورودی -->
        <footer class="input-area">
            <div class="input-wrapper">
                <input type="text" placeholder="پیام خود را بنویسید...">
                <button class="btn-send">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
            </div>
        </footer>
    </div>

    <script>
    const inputField = document.querySelector('.input-wrapper input');
    const sendBtn = document.querySelector('.btn-send');
    const chatArea = document.querySelector('.chat-area');

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, function (char) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
        });
    }

    function addUserMessage(text) {
        const row = document.createElement('div');
        row.className = 'message-row user';
        const bubble = document.createElement('div');
        bubble.className = 'msg user';
        bubble.textContent = text;
        row.appendChild(bubble);
        chatArea.appendChild(row);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function addBotMessage(text) {
        const row = document.createElement('div');
        row.className = 'message-row bot';
        const bubble = document.createElement('div');
        bubble.className = 'msg bot';
        bubble.textContent = text;
        row.appendChild(bubble);
        chatArea.appendChild(row);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    // تابع جدید برای ارسال پیام به PHP
    async function sendMessageToAPI(messageText, isGreeting = false) {
        try {
            // نمایش انیمیشن تایپ کردن
            const typingHTML = `
                <div class="message-row bot" id="typing-indicator-row">
                    <div class="msg bot typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatArea.insertAdjacentHTML('beforeend', typingHTML);
            chatArea.scrollTop = chatArea.scrollHeight;

            // ارسال درخواست به فایل PHP
            const response = await fetch('chat_api.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(isGreeting ? { action: 'greeting' } : { message: messageText })
            });

            const data = await response.json();

            // حذف انیمیشن تایپ
            const typingRow = document.getElementById('typing-indicator-row');
            if (typingRow) typingRow.remove();

            // نمایش جواب هوش مصنوعی
            if (data.reply) {
                addBotMessage(data.reply);
            } else {
                addBotMessage("خطا در دریافت پاسخ از سرور.");
            }

        } catch (error) {
            const typingRow = document.getElementById('typing-indicator-row');
            if (typingRow) typingRow.remove();
            addBotMessage("ارتباط با سرور برقرار نشد. لطفاً دوباره تلاش کنید.");
        }
    }

    async function showInitialGreeting() {
        await sendMessageToAPI(null, true);
    }

    function sendMessage() {
        const text = inputField.value.trim();
        if (text === "") return;

        // نمایش پیام کاربر
        addUserMessage(text);
        inputField.value = '';
        
        // ارسال به API
        sendMessageToAPI(text);
    }

    showInitialGreeting();

    sendBtn.addEventListener('click', sendMessage);
    inputField.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>

</body>
</html>
